# Firmware configuration for the HTC Desire (bravo).
#
# fwup cannot write raw YAFFS2 NAND, so this .fw is only the carrier of the
# squashfs rootfs that Nerves builds. scripts/bravo-image turns it into the
# YAFFS2 + boot images that are flashed to the phone.

require-fwup-version="1.0.0"

define(NERVES_FW_PRODUCT, "Nerves Firmware")
define(NERVES_FW_DESCRIPTION, "")
define(NERVES_FW_VERSION, "${NERVES_SDK_VERSION}")
define(NERVES_FW_PLATFORM, "bravo")
define(NERVES_FW_ARCHITECTURE, "arm")
define(NERVES_FW_AUTHOR, "")

define(NERVES_FW_DEVPATH, "/dev/mtdblock5")
define(NERVES_FW_APPLICATION_PART0_DEVPATH, "/dev/mtdblock4")
define(NERVES_FW_APPLICATION_PART0_FSTYPE, "yaffs2")
define(NERVES_FW_APPLICATION_PART0_TARGET, "/root")
define(ROOTFS, "${NERVES_SYSTEM}/images/rootfs.squashfs")

meta-product = ${NERVES_FW_PRODUCT}
meta-description = ${NERVES_FW_DESCRIPTION}
meta-version = ${NERVES_FW_VERSION}
meta-platform = ${NERVES_FW_PLATFORM}
meta-architecture = ${NERVES_FW_ARCHITECTURE}
meta-author = ${NERVES_FW_AUTHOR}

file-resource rootfs.img {
    host-path = ${ROOTFS}
}

task complete {
    on-resource rootfs.img { raw_write(0) }
}
task upgrade {
    on-resource rootfs.img { raw_write(0) }
}
